<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Galería de Bisutería Elegante</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    :root {
      --color-primary: #8c4c65;
      --color-secondary: #f4e4eb;
      --color-background: #fef9f8;
      --color-text: #4b3c40;
    }
    
    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background-color: var(--color-background);
      color: var(--color-text);
      overflow-x: hidden;
    }
    
    /* Navbar */
    .navbar {
      background-color: var(--color-secondary);
      box-shadow: 0 2px 10px rgba(140, 76, 101, 0.1);
    }
    
    .navbar-brand {
      font-weight: bold;
      font-size: 1.5rem;
      color: var(--color-primary) !important;
      display: flex;
      align-items: center;
    }
    
    .navbar-brand img {
      height: 40px;
      margin-right: 5px;
      border-radius: 50%;
      transition: transform 0.3s ease;
    }
    
    .navbar-brand:hover img {
      transform: rotate(15deg);
    }
    
    .navbar-nav .nav-link {
      color: var(--color-primary) !important;
      font-weight: 500;
      position: relative;
      padding: 5px 10px;
    }
    
    .navbar-nav .nav-link::after {
      content: '';
      position: absolute;
      width: 0;
      height: 2px;
      bottom: 0;
      left: 0;
      background-color: var(--color-primary);
      transition: width 0.3s ease;
    }
    
    .navbar-nav .nav-link:hover::after {
      width: 100%;
    }
    
    /* Hero Section */
    .hero-products {
      background: linear-gradient(135deg, rgba(140, 76, 101, 0.8) 0%, rgba(244, 228, 235, 0.6) 100%);
      color: white;
      text-align: center;
      padding: 80px 20px;
      margin-bottom: 50px;
      position: relative;
      overflow: hidden;
    }
    
    .hero-products::before {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background: url('static/pul.jpg') center/cover no-repeat;
      z-index: -1;
      opacity: 0.7;
    }
    
    .hero-products h1 {
      font-size: clamp(2rem, 5vw, 3.5rem);
      font-weight: bold;
      text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.3);
      margin-bottom: 20px;
      animation: fadeInUp 1s ease;
    }
    
    .hero-products p {
      font-size: clamp(1rem, 3vw, 1.3rem);
      max-width: 700px;
      margin: 0 auto 30px;
      text-shadow: 1px 1px 2px rgba(0, 0, 0, 0.3);
      animation: fadeInUp 1s ease 0.2s forwards;
      opacity: 0;
    }
    
    @keyframes fadeInUp {
      from {
        opacity: 0;
        transform: translateY(20px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }
    
    /* Galería de Productos */
    .gallery-section {
      padding: 0 20px 60px;
    }
    
    .section-title {
      text-align: center;
      margin: 0 auto 50px;
      font-size: clamp(1.8rem, 5vw, 2.5rem);
      font-weight: 600;
      color: var(--color-primary);
      position: relative;
      letter-spacing: 1px;
      max-width: 800px;
    }
    
    .section-title::after {
      content: '';
      display: block;
      width: 100px;
      height: 4px;
      background: linear-gradient(90deg, #f4e4eb, #8c4c65, #f4e4eb);
      margin: 20px auto;
      border-radius: 2px;
    }
    
    .gallery-container {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
      gap: 30px;
      max-width: 1400px;
      margin: 0 auto;
    }
    
    .gallery-item {
      position: relative;
      border-radius: 15px;
      overflow: hidden;
      box-shadow: 0 15px 30px rgba(140, 76, 101, 0.1);
      transition: all 0.4s ease;
      aspect-ratio: 1/1;
    }
    
    .gallery-item:hover {
      transform: translateY(-10px);
      box-shadow: 0 20px 40px rgba(140, 76, 101, 0.2);
    }
    
    .gallery-image {
      width: 100%;
      height: 100%;
      object-fit: cover;
      transition: transform 0.5s ease;
    }
    
    .gallery-item:hover .gallery-image {
      transform: scale(1.05);
    }
    
    .gallery-overlay {
      position: absolute;
      bottom: 0;
      left: 0;
      right: 0;
      background: linear-gradient(to top, rgba(140, 76, 101, 0.9), transparent);
      color: white;
      padding: 20px;
      transform: translateY(100%);
      transition: transform 0.3s ease;
    }
    
    .gallery-item:hover .gallery-overlay {
      transform: translateY(0);
    }
    
    .gallery-title {
      font-size: 1.3rem;
      font-weight: 600;
      margin-bottom: 10px;
    }
    
    .gallery-description {
      font-size: 0.95rem;
      line-height: 1.5;
      opacity: 0;
      transition: opacity 0.3s ease 0.2s;
    }
    
    .gallery-item:hover .gallery-description {
      opacity: 1;
    }
    
    /* Barra de información */
    .info-bar {
      background: linear-gradient(135deg, #8c4c65 0%, #a35c7a 100%);
      color: white;
      padding: 40px 20px;
      text-align: center;
      margin: 60px auto;
      border-radius: 15px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 30px;
      flex-wrap: wrap;
      box-shadow: 0 10px 30px rgba(140, 76, 101, 0.3);
      max-width: 1200px;
      width: 90%;
    }
    
    .info-bar img {
      height: 80px;
      border-radius: 50%;
      transition: transform 0.3s ease;
      box-shadow: 0 5px 15px rgba(0, 0, 0, 0.2);
    }
    
    .info-bar img:hover {
      transform: scale(1.1);
    }
    
    .info-bar-content {
      max-width: 600px;
    }
    
    .info-bar h3 {
      font-size: 1.8rem;
      margin-bottom: 15px;
    }
    
    .info-bar p {
      margin-bottom: 20px;
      font-size: 1.1rem;
    }
    
    .btn-info {
      background-color: var(--color-secondary);
      color: var(--color-primary);
      border: none;
      padding: 12px 30px;
      border-radius: 30px;
      font-weight: 600;
      transition: all 0.3s ease;
      display: inline-block;
      box-shadow: 0 5px 15px rgba(0, 0, 0, 0.1);
    }
    
    .btn-info:hover {
      background-color: white;
      transform: translateY(-3px);
      box-shadow: 0 8px 25px rgba(255, 255, 255, 0.3);
    }
    
    /* WhatsApp Button */
    .whatsapp-btn {
      position: fixed;
      bottom: 20px;
      right: 20px;
      background-color: #25D366;
      color: white;
      width: 60px;
      height: 60px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 30px;
      box-shadow: 0 4px 10px rgba(0, 0, 0, 0.2);
      z-index: 1000;
      transition: all 0.3s ease;
      text-decoration: none;
    }
    
    .whatsapp-btn:hover {
      transform: scale(1.1);
      box-shadow: 0 6px 15px rgba(0, 0, 0, 0.3);
    }
    
    /* Footer */
    .footer {
      background: linear-gradient(135deg, #f4e4eb 0%, #f8e1ed 100%);
      text-align: center;
      padding: 30px;
      margin-top: 0;
      color: var(--color-primary);
      position: relative;
    }
    
    .footer::before {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      height: 5px;
      background: linear-gradient(90deg, #8c4c65, #f4e4eb, #8c4c65);
    }
    
    .footer p {
      margin: 0;
      font-size: 1rem;
    }
  </style>
</head>
